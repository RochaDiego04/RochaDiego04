<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Diego Rocha — Full-Stack Engineer</title>
  <desc id="desc">Diego Rocha, Full-Stack Engineer based in Guadalajara, Mexico. Building production-ready software, from modern frontend experiences to scalable backend services.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pan    { from { transform: translate(0, 0); } to { transform: translate(-40px, -40px); } }
    @keyframes driftA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(70px, 26px); } }
    @keyframes driftB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -22px); } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes type1  { from { transform: translateX(0); } to { transform: translateX(56px); } }
    @keyframes type2  { from { transform: translateX(0); } to { transform: translateX(120px); } }

    /* ambient loops */
    .grid   { animation: pan 14s linear infinite; }
    .blobA  { animation: driftA 16s ease-in-out infinite; }
    .blobB  { animation: driftB 18s ease-in-out infinite; }
    .dot    { animation: pulse 2.4s ease-in-out infinite; }
    .cursor { animation: blink 1.1s step-end infinite; }

    /* intro, plays once */
    .r1 { animation: rise .9s cubic-bezier(.2,.7,.2,1) .05s both; }
    .r2 { animation: rise .9s cubic-bezier(.2,.7,.2,1) .20s both; }
    .r3 { animation: rise .9s cubic-bezier(.2,.7,.2,1) .35s both; }
    .c1 { animation: rise .7s cubic-bezier(.2,.7,.2,1) 0.60s both; }
    .c2 { animation: rise .7s cubic-bezier(.2,.7,.2,1) 0.70s both; }
    .c3 { animation: rise .7s cubic-bezier(.2,.7,.2,1) 0.80s both; }
    .c4 { animation: rise .7s cubic-bezier(.2,.7,.2,1) 0.90s both; }
    .c5 { animation: rise .7s cubic-bezier(.2,.7,.2,1) 1.00s both; }
    .term { animation: rise 1s cubic-bezier(.2,.7,.2,1) .3s both; }

    /* terminal session: prompts appear, commands type out, output prints */
    .p1 { animation: fade .1s linear .9s both; }
    .k1 { animation: type1 .48s steps(6, end) 1.1s both; }
    .o1 { animation: fade .25s ease-out 1.85s both; }
    .p2 { animation: fade .1s linear 2.1s both; }
    .k2 { animation: type2 .9s steps(13, end) 2.3s both; }
    .o2 { animation: fade .25s ease-out 3.45s both; }
    .o3 { animation: fade .25s ease-out 3.55s both; }
    .p3 { animation: fade .1s linear 3.85s both; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .k1, .k2 { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111823"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5B83D" stop-opacity="0"/>
      <stop offset=".3" stop-color="#F5B83D"/>
      <stop offset=".75" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#F5B83D" stop-opacity=".20"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#388BFD" stop-opacity=".18"/>
      <stop offset="1" stop-color="#388BFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fadeGrad" cx=".35" cy=".4" r=".75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade">
      <rect width="1200" height="340" fill="url(#fadeGrad)"/>
    </mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset=".44" stop-color="#F0F6FC"/>
      <stop offset=".5" stop-color="#F5C76B"/>
      <stop offset=".56" stop-color="#F0F6FC"/>
      <stop offset="1" stop-color="#F0F6FC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-700 0; 700 0" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>
    <clipPath id="termClip"><rect x="704" y="54" width="428" height="236" rx="12"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Background -->
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g mask="url(#fade)">
      <rect class="grid" width="1280" height="420" fill="url(#grid)"/>
    </g>
    <circle class="blobA" cx="250" cy="40" r="360" fill="url(#glowA)"/>
    <circle class="blobB" cx="1010" cy="330" r="340" fill="url(#glowB)"/>
    <rect width="1200" height="2" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="15.5" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- Intro -->
  <g class="r1">
    <circle class="dot" cx="78" cy="93" r="4" fill="#F5B83D"/>
    <text x="92" y="98.5" class="mono" font-size="15" letter-spacing="2.5" fill="#F5B83D">FULL-STACK ENGINEER<tspan fill="#6E7681">  ·  GUADALAJARA, MX</tspan></text>
  </g>
  <text class="sans r2" x="70" y="166" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Diego Rocha</text>
  <g class="sans r3" font-size="21" fill="#8B949E">
    <text x="72" y="208">Building production-ready software, from modern</text>
    <text x="72" y="237">frontend experiences to scalable backend services.</text>
  </g>

  <!-- Stack chips -->
  <g class="mono" font-size="14" text-anchor="middle">
    <g class="c1"><rect x="72" y="260" width="116" height="30" rx="15" fill="#F5B83D" fill-opacity=".08" stroke="#F5B83D" stroke-opacity=".35"/><text x="130" y="280" fill="#F2CC60">TypeScript</text></g>
    <g class="c2"><rect x="198" y="260" width="74" height="30" rx="15" fill="#F5B83D" fill-opacity=".08" stroke="#F5B83D" stroke-opacity=".35"/><text x="235" y="280" fill="#F2CC60">React</text></g>
    <g class="c3"><rect x="282" y="260" width="92" height="30" rx="15" fill="#F5B83D" fill-opacity=".08" stroke="#F5B83D" stroke-opacity=".35"/><text x="328" y="280" fill="#F2CC60">Angular</text></g>
    <g class="c4"><rect x="384" y="260" width="92" height="30" rx="15" fill="#F5B83D" fill-opacity=".08" stroke="#F5B83D" stroke-opacity=".35"/><text x="430" y="280" fill="#F2CC60">Node.js</text></g>
    <g class="c5"><rect x="486" y="260" width="84" height="30" rx="15" fill="#F5B83D" fill-opacity=".08" stroke="#F5B83D" stroke-opacity=".35"/><text x="528" y="280" fill="#F2CC60">NestJS</text></g>
  </g>

  <!-- Terminal (dark in both themes) -->
  <g class="term">
    <rect x="704" y="54" width="428" height="236" rx="12" fill="#010409" filter="url(#shadow)"/>
    <g clip-path="url(#termClip)">
      <rect x="704" y="54" width="428" height="36" fill="#161B22"/>
      <rect x="704" y="89.5" width="428" height="1" fill="#30363D"/>
    </g>
    <rect x="704.5" y="54.5" width="427" height="235" rx="11.5" stroke="#30363D"/>
    <circle cx="726" cy="72" r="6" fill="#FF5F57" fill-opacity=".9"/>
    <circle cx="746" cy="72" r="6" fill="#FEBC2E" fill-opacity=".9"/>
    <circle cx="766" cy="72" r="6" fill="#28C840" fill-opacity=".9"/>
    <text x="918" y="76.5" class="mono" font-size="13" fill="#6E7681" text-anchor="middle">diego@dev: ~</text>

    <g class="mono" font-size="15">
      <text class="p1" x="724" y="128" fill="#F5B83D">$</text>
      <text x="741" y="128" fill="#E6EDF3">whoami</text>
      <text class="o1" x="724" y="153" fill="#8B949E">diego-rocha — full-stack engineer</text>
      <text class="p2" x="724" y="186" fill="#F5B83D">$</text>
      <text x="741" y="186" fill="#E6EDF3">cat focus.txt</text>
      <text class="o2" x="724" y="211" fill="#8B949E">enterprise apps · system design</text>
      <text class="o3" x="724" y="236" fill="#8B949E">performance · ai-assisted workflows</text>
      <g class="p3">
        <text x="724" y="266" fill="#F5B83D">$</text>
        <rect class="cursor" x="741" y="253" width="9" height="17" fill="#E6EDF3"/>
      </g>
    </g>
    <!-- Typing effect: background-coloured covers step right, one character at a time -->
    <g clip-path="url(#termClip)" fill="#010409">
      <rect class="k1" x="739" y="112" width="392" height="22"/>
      <rect class="k2" x="739" y="170" width="392" height="22"/>
    </g>
  </g>
</svg>
