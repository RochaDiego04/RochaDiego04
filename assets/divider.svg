<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" fill="none" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B949E" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8B949E" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3A82B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E3A82B"/>
      <stop offset="1" stop-color="#E3A82B" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-320 0; 1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect y="11.5" width="1200" height="1" fill="url(#base)"/>
  <rect y="11" width="1200" height="2" fill="url(#shine)"/>
</svg>
